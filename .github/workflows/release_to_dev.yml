name: Release to Dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  release-to-dev:
    # The SDK's pack fetches the pinned core with PACKAGE_TOKEN and builds none. This private copy
    # is not a release, so it keeps the test key.
    runs-on: ubuntu-latest
    concurrency: release-to-dev
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sherlo-io'

      - name: Download Sherlo packages
        run: ./scripts/init-env.sh
        env:
          CLIENT_STAGE: dev
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: yarn
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}

      - name: Build packages
        run: yarn build

      - name: Prepare and publish to GitHub Packages
        run: |
          VERSION=$(node -p "require('./lerna.json').version")
          DEV_VERSION="${VERSION}-dev.${GITHUB_RUN_ID}"

          # Run the SDK's prepack script before the rename below: yarn finds a workspace by its
          # name, and the script runs yarn. The pack itself happens in `npm publish`, which skips
          # the script.
          (cd packages/react-native-storybook && npm run prepack)

          node -e "
            const fs = require('fs');

            const cli = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
            cli.name = '@sherlo-io/cli';
            cli.version = '${DEV_VERSION}';
            cli.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'restricted' };
            fs.writeFileSync('packages/cli/package.json', JSON.stringify(cli, null, 2) + '\n');

            const sdk = JSON.parse(fs.readFileSync('packages/react-native-storybook/package.json', 'utf8'));
            sdk.name = '@sherlo-io/react-native-storybook';
            sdk.version = '${DEV_VERSION}';
            sdk.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'restricted' };
            fs.writeFileSync('packages/react-native-storybook/package.json', JSON.stringify(sdk, null, 2) + '\n');
          "

          cd packages/cli && npm publish --tag dev
          cd ../react-native-storybook && npm publish --ignore-scripts --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The prepack fetches the pinned core from package storage with it.
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
