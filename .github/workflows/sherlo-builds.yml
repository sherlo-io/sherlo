name: 'Sherlo Builds'

on:
  workflow_dispatch:
    inputs:
      rn_preview_android:
        description: 'React Native Preview | Android'
        required: false
        default: false
        type: boolean
      rn_preview_ios:
        description: 'React Native Preview | iOS'
        required: false
        default: false
        type: boolean
      rn_development_android:
        description: 'React Native Dev | Android'
        required: false
        default: false
        type: boolean
      rn_development_ios:
        description: 'React Native Dev | iOS'
        required: false
        default: false
        type: boolean
      expo_preview_ios:
        description: 'Expo Preview | iOS'
        required: false
        default: false
        type: boolean
      expo_preview_android:
        description: 'Expo Preview | Android'
        required: false
        default: false
        type: boolean
      expo_development_android:
        description: 'Expo Dev | Android'
        required: false
        default: false
        type: boolean
      expo_development_ios:
        description: 'Expo Dev | iOS'
        required: false
        default: false
        type: boolean
      pack_sdk_from_source:
        description: 'Build against packages/react-native-storybook from this ref, not the committed tarball'
        required: false
        default: false
        type: boolean
      libs_ref:
        description: "Build @sherlo/* libs from sherlo-api@<ref> - pass 'feature/sherlo-3' when this ref descends from it, empty for a main-based ref"
        required: false
        default: ''
        type: string

jobs:
  rn_preview_ios:
    uses: ./.github/workflows/build:ios.yml
    if: ${{ github.event.inputs.rn_preview_ios == 'true'}}
    name: RN Preview iOS Build
    secrets: inherit
    with:
      profile: 'preview'
      project: 'react-native'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}

  rn_preview_android:
    uses: ./.github/workflows/build:android.yml
    if: ${{ github.event.inputs.rn_preview_android == 'true'}}
    name: RN Preview Android Build
    secrets: inherit
    with:
      profile: 'preview'
      project: 'react-native'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}

  rn_development_ios:
    uses: ./.github/workflows/build:ios.yml
    if: ${{ github.event.inputs.rn_development_ios == 'true'}}
    name: RN Development iOS Build
    secrets: inherit
    with:
      profile: 'development'
      project: 'react-native'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}

  rn_development_android:
    uses: ./.github/workflows/build:android.yml
    if: ${{ github.event.inputs.rn_development_android == 'true'}}
    name: RN Development Android Build
    secrets: inherit
    with:
      profile: 'development'
      project: 'react-native'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}

  expo_preview_ios:
    uses: ./.github/workflows/build:ios.yml
    if: ${{ github.event.inputs.expo_preview_ios == 'true'}}
    name: Expo Preview iOS Build
    secrets: inherit
    with:
      profile: 'preview'
      project: 'expo'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}

  expo_preview_android:
    uses: ./.github/workflows/build:android.yml
    if: ${{ github.event.inputs.expo_preview_android == 'true'}}
    name: Expo Preview Android Build
    secrets: inherit
    with:
      profile: 'preview'
      project: 'expo'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}

  expo_development_ios:
    uses: ./.github/workflows/build:ios.yml
    if: ${{ github.event.inputs.expo_development_ios == 'true'}}
    name: Expo Development iOS Build
    secrets: inherit
    with:
      profile: 'development'
      project: 'expo'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}

  expo_development_android:
    uses: ./.github/workflows/build:android.yml
    if: ${{ github.event.inputs.expo_development_android == 'true'}}
    name: Expo Development Android Build
    secrets: inherit
    with:
      profile: 'development'
      project: 'expo'
      pack_sdk_from_source: ${{ inputs.pack_sdk_from_source }}
      libs_ref: ${{ inputs.libs_ref }}
