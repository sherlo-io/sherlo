name: 'pr_checks'

on:
  pull_request:
    branches:
      - main
      - feature/sherlo-3
      - epic/**

jobs:
  # THE SEALED CORES' OWN SUITES: the JS core's tests, and the C core's harness, which compiles the
  # C core with the runner's own compiler and runs it. Neither reads the API client libraries, so
  # this job installs only the core package's own dependencies (`workspaces focus`) and skips the
  # sherlo-api download and caches the checks job needs. The suite builds the Android libraries
  # whenever the runner has the NDK; the iOS xcframework needs Xcode, so only a pack on macOS
  # builds it.
  core:
    name: checks (sherlo-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the core package's dependencies
        run: yarn workspaces focus @sherlo/core

      - name: Unit tests (JS core and C harness)
        working-directory: packages/sherlo-core
        run: yarn test

  checks:
    name: checks (${{ matrix.package.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: cli
            dir: packages/cli
          - name: react-native-storybook
            dir: packages/react-native-storybook

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A PR into feature/sherlo-3 or an epic/** branch builds its @sherlo/* libraries from
      # sherlo-api source - the S3 dev-stage canon can predate lib/SDK changes the CLI code
      # depends on (composition gap: CLI source is current, its @sherlo/* portal deps are not).
      # The source is sherlo-api feature/sherlo-3 (`ref` here), except for a PR whose head
      # branch is an epic/** branch that sherlo-api also has, by that exact name: its libraries
      # come from that branch, because the epic's CLI code needs the same epic's service
      # changes. The commit step below makes that choice, since only it can see sherlo-api's
      # branches. A PR against main keeps the unchanged S3-canon path - empty `ref` here is
      # that opt-out.
      - name: Resolve sherlo-lib source
        id: libs
        run: |
          if [ "$GITHUB_BASE_REF" = "feature/sherlo-3" ] || [[ "$GITHUB_BASE_REF" == epic/* ]]; then
            echo "ref=feature/sherlo-3" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      # Only minted when a from-source libs build is actually needed - mirrors the
      # release_to_dev.yml SHERLO_BOT app-token pattern, since GITHUB_TOKEN has no access
      # to sherlo-io/sherlo-api (a separate private repo).
      - name: Create GH App Token (sherlo-api clone)
        if: steps.libs.outputs.ref != ''
        id: github_app_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.SHERLO_BOT_APP_ID }}
          private_key: ${{ secrets.SHERLO_BOT_PRIVATE_KEY }}

      # `ref` above names a branch, and a branch moves, so it cannot key a cache. This resolves
      # it to the exact sherlo-api commit, which then keys both caches below and is the ref
      # init-env.sh builds the libs from. A PR from an epic/** branch takes sherlo-api's branch
      # of the same name instead of `ref`, when sherlo-api has one.
      - name: Resolve the sherlo-api commit the libs are built from
        if: steps.libs.outputs.ref != ''
        id: libs_commit
        env:
          CLONE_TOKEN: ${{ steps.github_app_token.outputs.token }}
          DEFAULT_LIBS_BRANCH: ${{ steps.libs.outputs.ref }}
        # Run outside this checkout: actions/checkout leaves this repository's own token in its
        # git config as an extra header, and git would send that instead of CLONE_TOKEN.
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          SHERLO_API_URL="https://x-access-token:${CLONE_TOKEN}@github.com/sherlo-io/sherlo-api.git"
          LIBS_BRANCH="$DEFAULT_LIBS_BRANCH"
          if [[ "$GITHUB_HEAD_REF" == epic/* ]] && git ls-remote --exit-code "$SHERLO_API_URL" "refs/heads/$GITHUB_HEAD_REF" > /dev/null; then
            LIBS_BRANCH="$GITHUB_HEAD_REF"
          fi
          sha=$(git ls-remote "$SHERLO_API_URL" "refs/heads/$LIBS_BRANCH" | cut -f1)
          if [ -z "$sha" ]; then
            echo "Error: '$LIBS_BRANCH' names no branch in sherlo-io/sherlo-api" >&2
            exit 1
          fi
          echo "Libs come from sherlo-api $LIBS_BRANCH@$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Both caches carry the sherlo-api commit in their key, never yarn.lock alone: the libs
      # are built from a moving head that yarn.lock knows nothing about, and node_modules links
      # to them. A PR against main takes its libs from the S3 canon instead, whose version this
      # workflow cannot name, so that path is left uncached and installs fresh.
      - name: Cache sherlo-lib
        if: steps.libs.outputs.ref != ''
        id: sherlo_lib_cache
        uses: actions/cache@v4
        with:
          path: sherlo-lib
          key: sherlo-lib-${{ steps.libs_commit.outputs.sha }}

      - name: Cache node_modules
        if: steps.libs.outputs.ref != ''
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ steps.libs_commit.outputs.sha }}

      - name: Download Sherlo packages
        if: steps.sherlo_lib_cache.outputs.cache-hit != 'true'
        run: ./scripts/init-env.sh
        env:
          CLIENT_STAGE: dev
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          LIBS_REF: ${{ steps.libs_commit.outputs.sha }}
          SHERLO_API_CLONE_TOKEN: ${{ steps.github_app_token.outputs.token }}

      # init-env.sh ends in `yarn install`; when the libs came from the cache it did not run,
      # so the install runs here. It stays the authority over a restored node_modules.
      - name: Install dependencies
        if: steps.sherlo_lib_cache.outputs.cache-hit == 'true'
        run: yarn install

      - name: Eslint
        working-directory: ${{ matrix.package.dir }}
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit -p ${{ matrix.package.dir }}

      # The sealed core's source types itself against the SDK's seam
      # (packages/react-native-storybook/src/sealedCore/seam.ts), and only the type check holds the
      # two together. It runs here, not in the core job: seam.ts pulls in react-native's types,
      # which only this job's full install carries.
      - name: Typecheck the sealed core
        if: matrix.package.name == 'react-native-storybook'
        run: yarn tsc --noEmit -p packages/sherlo-core

      # THE POSE CONTRACT AND ITS READER ARE GENERATED from the types the CLI's seams
      # declare (packages/cli/scripts/generate-pose-contract.ts). This regenerates both
      # and diffs: a hand edit to either, or a seam type changed without regenerating,
      # reds here by name. Without it the two copies drift back apart silently, which is
      # the whole defect generating them removes.
      - name: Pose contract is what the seam types say
        if: matrix.package.name == 'cli'
        working-directory: ${{ matrix.package.dir }}
        run: yarn check:pose-contract

      # THE LAW'S OWN TYPECHECK, and it has no other home: packages/cli/tsconfig.json
      # includes only `src`, so contracts/pose.contract.law.ts - which pins the contract
      # to the live seam types in BOTH directions - was never compiled in CI. A law
      # nobody runs pins nothing.
      - name: Typecheck the pose contract law
        if: matrix.package.name == 'cli'
        run: yarn tsc --noEmit -p contracts

      # THE PACKAGED-BUILD GATE, cli only - the command the e2e suites run when a
      # run is dispatched with `cli_ref=<this branch>`. A ref whose packaged build
      # fails kills EVERY e2e run that names it, at install, before a single test
      # starts. Not redundant with the Typecheck above: `tsc -p` checks every file
      # under the package, while ncc type-checks only the graph reachable from
      # `src/index.ts` - but ncc is the one that ships, and the one e2e installs
      # through. Keep both. See manual_tests.yml, which carries the same step on
      # the dispatch path along with the full account of why.
      - name: Packaged build (the gate every e2e run installs through)
        if: matrix.package.name == 'cli'
        working-directory: ${{ matrix.package.dir }}
        run: yarn build

      # THE BYTE RATCHET's other half, for the cli package only (nothing in
      # react-native-storybook compares against a committed fixture). The CLI's
      # render-layer suites compare what the CLI renders against fixtures
      # committed in sherlo-tester; without this checkout those cases classify as
      # SKIPPED and the lane goes green having proved nothing about what a real
      # user sees - which is precisely how a render-layer refactor could change
      # the product with a green PR. The checkout gate in
      # packages/cli/src/commands/test/__tests__/testerCheckout.ts REDS in CI if
      # this step is ever removed. See scripts/checkout-tester.sh for how the
      # sherlo-tester ref is resolved from the PR's base branch, and what a ref
      # mismatch across the two repositories does.
      - name: Create GH App Token (sherlo-tester clone)
        if: matrix.package.name == 'cli'
        id: tester_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.SHERLO_BOT_APP_ID }}
          private_key: ${{ secrets.SHERLO_BOT_PRIVATE_KEY }}

      - name: Check out sherlo-tester (byte-ratchet fixtures)
        if: matrix.package.name == 'cli'
        run: ./scripts/checkout-tester.sh "$GITHUB_BASE_REF" "${{ runner.temp }}/sherlo-tester"
        env:
          TESTER_CLONE_TOKEN: ${{ steps.tester_token.outputs.token }}

      - name: Unit tests
        working-directory: ${{ matrix.package.dir }}
        env:
          # Deliberately OUTSIDE this repository's tree, so 4,700 sherlo-tester
          # files never reach eslint, tsc or vitest's own file discovery. Empty
          # for react-native-storybook, whose suite never reads it.
          SHERLO_TESTER_ROOT: ${{ matrix.package.name == 'cli' && format('{0}/sherlo-tester', runner.temp) || '' }}
        run: yarn test
