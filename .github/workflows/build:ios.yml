name: 'build:ios'
on:
  workflow_call:
    inputs:
      project:
        description: 'Project to build'
        required: true
        type: string # 'expo' or 'react-native'
        default: 'expo'
      profile:
        required: true
        type: string
        description: 'Build profile to use (development, preview)'

jobs:
  ios_build:
    runs-on: macos-15
    env:
      # Every install reads @sherlo-io/time-limits from GitHub's package registry (.yarnrc.yml).
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        if: ${{ !inputs.skip_build }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Select Xcode Version
        if: ${{ !inputs.skip_build }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - run: |
          xcode-select -print-path
      - run: |
          xcodebuild -version

      - name: Setup Cocoapods
        if: ${{ !inputs.skip_build }}
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: Install with the sherlo libraries
        uses: ./.github/actions/install-with-libs
        with:
          app-id: ${{ secrets.SHERLO_BOT_APP_ID }}
          private-key: ${{ secrets.SHERLO_BOT_PRIVATE_KEY }}
          package-token: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build the packages
        run: cd packages/cli && yarn build && cd ../react-native-storybook && yarn build

      - name: Install project dependencies
        working-directory: testing/${{ inputs.project }}
        run: yarn install --immutable

      - name: Setup EAS
        if: ${{ !inputs.skip_build }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        working-directory: testing/${{ inputs.project }}
        run: yarn build:ios:${{ inputs.profile }}

      - name: Sanitize branch name
        id: branch
        run: echo "name=$(echo '${{ github.head_ref || github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.profile }}-${{ inputs.project }}-${{ steps.branch.outputs.name }}
          path: testing/${{ inputs.project }}/builds/${{ inputs.profile }}/ios.tar.gz
          retention-days: 90
          overwrite: true
