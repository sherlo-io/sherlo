name: ios-linking
on:
  pull_request:
    paths:
      - packages/react-native-storybook/react-native.config.js
      - packages/react-native-storybook/metro/sherloBuild.js
      - testing/react-native/ios/**
      - .github/workflows/ios-linking.yml
      - scripts/check-ios-linking.sh
  # spike only - remove in the task
  push:
    branches: ['spike/debug-builds-any-name/**']

jobs:
  ios_linking:
    runs-on: macos-15
    env:
      # Every install reads @sherlo-io/time-limits from GitHub's package registry (.yarnrc.yml).
      GITHUB_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Cocoapods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: latest

      - name: Install with the sherlo libraries
        uses: ./.github/actions/install-with-libs
        with:
          app-id: ${{ secrets.SHERLO_BOT_APP_ID }}
          private-key: ${{ secrets.SHERLO_BOT_PRIVATE_KEY }}
          package-token: ${{ secrets.PACKAGE_TOKEN }}

      - name: Build the packages
        run: cd packages/cli && yarn build && cd ../react-native-storybook && yarn build

      - name: Install project dependencies
        working-directory: testing/react-native
        run: yarn install --immutable

      - name: Check the iOS linking
        run: scripts/check-ios-linking.sh
