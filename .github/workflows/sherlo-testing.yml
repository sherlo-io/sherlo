name: 'Sherlo Testing'

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'test'
          - 'prod'
      all_devices:
        description: 'all-devices'
        required: false
        default: false
        type: boolean
      many_stories:
        description: 'many-stories'
        required: false
        default: false
        type: boolean
      standard_rn:
        description: 'react-native app, full run'
        required: false
        default: false
        type: boolean
      standard_expo:
        description: 'expo app, full run'
        required: false
        default: false
        type: boolean
      staged:
        description: 'expo app, staged run (JS-only, no builds)'
        required: false
        default: false
        type: boolean
      eas_cloud_build:
        description: 'expo app, eas-cloud-build'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 5 * * *' # 5 AM UTC every day (6 AM in Poland)

jobs:
  check_if_monday:
    runs-on: ubuntu-latest
    outputs:
      is_monday: ${{ steps.check_day.outputs.is_monday }}
    steps:
      - id: check_day
        run: |
          if [[ $(date +%u) == 1 ]]; then
            echo "is_monday=true" >> $GITHUB_OUTPUT
          else
            echo "is_monday=false" >> $GITHUB_OUTPUT
          fi

  all_devices:
    needs: check_if_monday
    uses: ./.github/workflows/test.yml
    if: ${{ ((github.event_name == 'schedule' && needs.check_if_monday.outputs.is_monday == 'true') || github.event.inputs.all_devices == 'true') && always() && !failure() && !cancelled() }}
    name: All Devices
    secrets: inherit
    with:
      env: ${{ github.event_name == 'schedule' && 'dev' || inputs.env }}
      app: 'expo'
      sherlo_project: 'device-testing'
      config: 'all-devices'

  many_stories:
    needs: check_if_monday
    uses: ./.github/workflows/test.yml
    if: ${{ ((github.event_name == 'schedule' && needs.check_if_monday.outputs.is_monday == 'true') || github.event.inputs.many_stories == 'true') && always() && !failure() && !cancelled() }}
    name: Many Stories
    secrets: inherit
    with:
      env: ${{ github.event_name == 'schedule' && 'dev' || inputs.env }}
      app: 'expo'
      sherlo_project: 'many-stories'
      config: 'many-stories'

  standard_rn:
    needs: check_if_monday
    uses: ./.github/workflows/test.yml
    if: ${{ ((github.event_name == 'schedule' && needs.check_if_monday.outputs.is_monday == 'true') || github.event.inputs.standard_rn == 'true') && always() && !failure() && !cancelled() }}
    name: Standard (React Native)
    secrets: inherit
    with:
      env: ${{ github.event_name == 'schedule' && 'dev' || github.event.inputs.env }}
      app: 'react-native'
      sherlo_project: 'react-native'

  standard_expo:
    needs: check_if_monday
    uses: ./.github/workflows/test.yml
    if: ${{ ((github.event_name == 'schedule' && needs.check_if_monday.outputs.is_monday == 'true') || github.event.inputs.standard_expo == 'true') && always() && !failure() && !cancelled() }}
    name: Standard (Expo)
    secrets: inherit
    with:
      env: ${{ github.event_name == 'schedule' && 'dev' || github.event.inputs.env }}
      app: 'expo'
      sherlo_project: 'expo'

  # The staged road tests against the base a full run registered, so it follows
  # Standard (Expo) and shares its Sherlo project. When that job is not selected
  # it is skipped rather than failed, and this one still runs against whatever
  # base the project already holds.
  staged:
    needs: [check_if_monday, standard_expo]
    uses: ./.github/workflows/test.yml
    if: ${{ ((github.event_name == 'schedule' && needs.check_if_monday.outputs.is_monday == 'true') || github.event.inputs.staged == 'true') && always() && !failure() && !cancelled() }}
    name: Staged (JS-only)
    secrets: inherit
    with:
      env: ${{ github.event_name == 'schedule' && 'dev' || github.event.inputs.env }}
      app: 'expo'
      sherlo_project: 'expo'
      with_builds: false

  eas_cloud_build:
    needs: check_if_monday
    uses: ./.github/workflows/test:eas-cloud-build.yml
    if: ${{ ((github.event_name == 'schedule' && needs.check_if_monday.outputs.is_monday == 'true') || github.event.inputs.eas_cloud_build == 'true') && always() && !failure() && !cancelled() }}
    name: EAS Cloud Build
    secrets: inherit
    with:
      env: ${{ github.event_name == 'schedule' && 'dev' || github.event.inputs.env }}
