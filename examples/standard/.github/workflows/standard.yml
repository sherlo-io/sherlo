name: Sherlo Test - Standard

# ══════════════════════════════════════════════════════════════════════════════
# WORKFLOW:
#            [ 🤖 Android job ]      [ 🍎 iOS job ]
#                     │                    │
#                     └─────────┬──────────┘
#                               ▼
#                        [ 👀 One test ]
#
# Each job builds its platform's app and sends it. The two jobs join into one test.
# ══════════════════════════════════════════════════════════════════════════════

# Triggers on:
# - Push to main branch
# - Manual trigger from GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sherlo:
    name: Sherlo (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      SHERLO_TOKEN: ${{ secrets.SHERLO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: 📥 Install dependencies
        run: yarn install --immutable

      - name: 🧪 Run Sherlo
        uses: sherlo-io/sherlo@v3
        with:
          platform: ${{ matrix.platform }}
