name: Sherlo Test - Standard

# ══════════════════════════════════════════════════════════════════════════════
# WORKFLOW:
#                 [ 🤖 Build Android ]    [ 🍎 Build iOS ]
#                           │                    │
#                           └──────────┬─────────┘
#                                      ▼
#                               [ 🧪 Run Test ]
#
# ══════════════════════════════════════════════════════════════════════════════

# Triggers on:
# - Push to main branch
# - Manual trigger from GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # SETUP VALIDATOR (optional, remove after successful run)
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Setup
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Check tokens and EAS configuration
        uses: ./.github/actions/validate-setup
        with:
          sherlo-token: ${{ secrets.SHERLO_TOKEN }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════════
  #
  #                         ▼ CORE SHERLO WORKFLOW ▼
  #
  # ════════════════════════════════════════════════════════════════════════════

  # ────────────────────────────────────────────────────────────────────────────
  # 🤖 BUILD ANDROID
  #
  # Creates Android simulator build
  # ────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install dependencies
        run: yarn install

      # Uses 'preview-simulator' profile from eas.json
      - name: 🤖 Build Android Simulator
        run: |
          eas build \
            --non-interactive \
            --local \
            --platform android \
            --profile preview-simulator \
            --output android.apk

      - name: 📤 Upload Android build
        uses: actions/upload-artifact@v6
        with:
          name: android-build
          path: android.apk

  # ────────────────────────────────────────────────────────────────────────────
  # 🍎 BUILD iOS
  #
  # Creates iOS simulator build
  # ────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: validate

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install dependencies
        run: yarn install

      # Uses 'preview-simulator' profile from eas.json
      - name: 🍎 Build iOS Simulator
        run: |
          eas build \
            --non-interactive \
            --local \
            --platform ios \
            --profile preview-simulator \
            --output ios.tar.gz

      - name: 📤 Upload iOS build
        uses: actions/upload-artifact@v6
        with:
          name: ios-build
          path: ios.tar.gz

  # ────────────────────────────────────────────────────────────────────────────
  # 🧪 RUN TEST
  #
  # Runs visual test on Android and iOS builds
  # ────────────────────────────────────────────────────────────────────────────
  sherlo-test:
    name: Run Test
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 📥 Download Android and iOS builds
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      # Build paths make this a full run: the binaries are tested and registered
      # as the native base, so a later run with no build paths can test JS alone.
      - name: 🧪 Run Sherlo test
        run: |
          npx sherlo test \
            --android android.apk \
            --ios ios.tar.gz \
            --token ${{ secrets.SHERLO_TOKEN }}
