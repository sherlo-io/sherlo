plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.spikenet'
version = '0.1.0'

android {
  namespace "expo.modules.spikenet"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // The same OkHttp React Native already ships (Gradle resolves to RN's version).
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
