plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.spikenet'
version = '0.1.0'

android {
  namespace "expo.modules.spikenet"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // ReactApplication / ReactHost, to reload the bundle natively.
  implementation 'com.facebook.react:react-android'
}
