name: Sherlo Test - EAS Cloud Build

# Triggers on:
# - Push to main branch
# - Manual trigger from GitHub UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # SETUP VALIDATOR (optional, remove after successful run)
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Setup
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 🔍 Check tokens and EAS configuration
        uses: ./.github/actions/validate-setup
        with:
          sherlo-token: ${{ secrets.SHERLO_TOKEN }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════════
  #
  #                         ▼ CORE SHERLO WORKFLOW ▼
  #
  # ════════════════════════════════════════════════════════════════════════════

  # ────────────────────────────────────────────────────────────────────────────
  # ☁️ BUILD ON EXPO & TEST
  #
  # `sherlo test` does the hand-off between Sherlo and Expo itself, because the
  # config says `build.tool: "eas"`:
  #   ↓ Sherlo opens the test and starts the EAS builds on Expo servers
  #   ↓ Expo runs the `eas-build-on-complete` script after each build, which
  #     uploads that build into the test
  #   ↓ Sherlo runs the visual test when both builds are in
  # ────────────────────────────────────────────────────────────────────────────
  sherlo-test:
    name: Build on Expo & Test
    runs-on: ubuntu-latest
    needs: validate
    env:
      SHERLO_TOKEN: ${{ secrets.SHERLO_TOKEN }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install dependencies
        run: yarn install --immutable

      - name: 🧪 Run Sherlo
        uses: sherlo-io/sherlo@v3
